name: Publish to npm
run-name: 'Publish ${{ github.ref_name }}: ${{ github.event.head_commit.message }}'

# In a monorepo, releases are tagged per-package: <package-name>-v<version> (e.g. core-v1.0.0)
on:
  push:
    tags:
      - '*-v*'

# id-token: write lets npm trusted publishing authenticate this workflow via OIDC (no npm token)
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # full history so the tagged commit can be checked against origin/main
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main. Merge first, then tag a commit on main."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm >= 11.5.1, which trusted publishing requires
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # never let a dependency cache feed into a release
          package-manager-cache: false

      - name: Verify tag matches package version
        run: |
          # Expects tag format: <package-name>-v<version> (e.g. core-v1.0.0)
          TAG="$GITHUB_REF_NAME"
          if [[ "$TAG" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            PKG_NAME="${BASH_REMATCH[1]}"
            EXPECTED_VERSION="${BASH_REMATCH[2]}"
            PACKAGE_PATH="packages/$PKG_NAME"
          else
            echo "Error: Tag '$TAG' does not match format '<package-name>-v<version>' (e.g. core-v1.0.0)"
            exit 1
          fi

          if [ ! -f "$PACKAGE_PATH/package.json" ]; then
            echo "Error: $PACKAGE_PATH/package.json not found for tag $TAG."
            exit 1
          fi

          ACTUAL_VERSION="$(node -p "require('./$PACKAGE_PATH/package.json').version")"
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Tag version ($EXPECTED_VERSION) does not match $PACKAGE_PATH/package.json version ($ACTUAL_VERSION)"
            exit 1
          fi
          echo "Verified $PACKAGE_PATH version $ACTUAL_VERSION matches tag $TAG"
          echo "TARGET_PACKAGE_PATH=$PACKAGE_PATH" >> $GITHUB_ENV
          echo "EXPECTED_VERSION=$EXPECTED_VERSION" >> $GITHUB_ENV

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Full gate (lint, build, typecheck, tests, attw); publishing a tarball skips lifecycle scripts like prepublishOnly
      - name: Check
        run: bun run check

      # Pack with Bun so workspace: dependencies are rewritten to semver ranges (npm would upload them literally),
      # then publish the tarball; trusted publishing attaches provenance automatically.
      # NOTE: npm trusted publishing requires the package to exist on npmjs.com first before OIDC can publish.
      - name: Pack and publish to npm
        run: |
          mkdir -p node_modules/.cache/dist-pack
          TARBALL="node_modules/.cache/dist-pack/$(basename "$TARGET_PACKAGE_PATH").tgz"
          bun pm pack --cwd "$TARGET_PACKAGE_PATH" --filename "$TARBALL"
          TAG_ARG=""
          # any semver prerelease (1.0.0-beta.1, 1.0.0-0, ...) goes to "next", never "latest"
          if [[ "$EXPECTED_VERSION" == *-* ]]; then
            TAG_ARG="--tag next"
          fi
          npm publish "$TARBALL" $TAG_ARG
