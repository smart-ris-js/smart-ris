[install]
# Supply-chain protection: skip versions younger than 3 days
minimumReleaseAge = 259200

[test]
# test discovery skips these (node_modules is always skipped)
pathIgnorePatterns = [
  "**/dist/**",
  "**/scratch/**",
  "**/temp/**",
  "**/old/**",
  "**/tests/fixtures/**"
]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/dist/**",
  "**/tests/**"
]
coverageReporter = ["text"]

# checked per file, only with --coverage
[test.coverageThreshold]
lines = 0.9
functions = 0.65